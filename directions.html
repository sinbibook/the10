<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 렌더 게이트: 매핑 전 placeholder 깜빡임 방지 (매핑 완료 시 페이드인) -->
    <style>
      html.tpl-loading body {
        opacity: 0;
      }
      body {
        opacity: 1;
        transition: opacity 0.3s ease;
      }
    </style>
    <script>
      document.documentElement.classList.add('tpl-loading');
      window.__tplReveal = function () {
        document.documentElement.classList.remove('tpl-loading');
      };
      setTimeout(function () {
        window.__tplReveal && window.__tplReveal();
      }, 3000);
    </script>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:type" content="website" />
    <title data-page-title>강릉 더시월 독채펜션 - 오시는길</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" type="text/css" href="styles/theme.css" />
    <link rel="stylesheet" type="text/css" href="styles/reset.css" />
    <link rel="stylesheet" type="text/css" href="styles/style.css" />
    <!-- Open Graph Meta Tags for Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="강릉 더시월 독채펜션 - 오시는길" />
  <meta property="og:description" content="사천진해수욕장이 차량 4분거리에 위치하여 있고 전객실 독채로 이루어진 강릉 더시월 독채펜션입니다. 여름철에는 야외수영장에서 무더위를 날리실 수" />
  <meta property="og:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2024/08/08/HVjKN134t8ch.jpg" />
  <meta property="og:url" content="https://the10.kr" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="강릉 더시월 독채펜션 - 오시는길" />
  <meta name="twitter:description" content="사천진해수욕장이 차량 4분거리에 위치하여 있고 전객실 독채로 이루어진 강릉 더시월 독채펜션입니다. 여름철에는 야외수영장에서 무더위를 날리실 수" />
  <meta name="twitter:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2024/08/08/HVjKN134t8ch.jpg" />
  <meta name="naver-site-verification" content="6b8e5b5ab91deb7a32a56d6c9da953726137a792" />
  <meta name="google-site-verification" content="sJtnOzkUT0Hzw1RWeahoCJMojrRQlRLAF-q1e6ktXYo" />
</head>

  <body oncontextmenu="return false;" onselectstart="return false" ondragstart="return false;">
    <div id="wrap">
      <div id="header-wrap"></div>

      <div id="container">
        <!-- 원본 traffic.html (오시는길).
             원본은 daum roughmap 임베드(고정 key)였으나 좌표 기반 kakao-maps-sdk 로 교체했다. -->
        <section id="content" class="sub6_1 sub_traffic">
          <!-- data-* 속성 : data-directions-hero-image
               pages.directions.sections[0].hero.images[isSelected][0].url (background-image) -->
          <div class="sub_visual" data-directions-hero-image>
            <div class="txt_box">
              <h3>LOCATION</h3>
              <!-- data-* 속성 : data-property-caption -->
              <span data-property-caption="{name} 오시는길"></span>
            </div>
          </div>
          <!--// sub_visual -->

          <div class="sub_cate_wrap">
            <div class="sub_inner">
              <ul>
                <li class="on"><a href="./directions.html">오시는길</a></li>
              </ul>
            </div>
          </div>

          <div class="sub_cont">
            <!-- 카카오맵 : property.latitude / property.longitude
                 좌표가 없어도 영역이 유지되도록 높이/배경색은 CSS 에서 준다
                 (원본은 daum roughmap 임베드가 자체 높이를 가졌다) -->
            <div class="map"><div id="kakao-map"></div></div>
            <div class="map_info">
              <!-- data-* 속성 : data-property-address (property.address) -->
              <strong data-property-address></strong>
              <!-- data-* 속성 : data-directions-notice | 동적 매핑 필요
                   pages.directions.sections[0].notice.title / .description -->
              <dl data-directions-notice>
                <!-- MAPPER: notice → <dt>title</dt><dd>description</dd> -->
              </dl>
            </div>
          </div>
          <!--// sub_cont -->
        </section>
      </div>

      <div id="footer-wrap"></div>
    </div>

    <script src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="js/image-helpers.js"></script>
    <script src="js/preview-handler.js"></script>
    <script src="js/data-mapper/core/base-mapper.js"></script>
    <script src="js/data-mapper/pages/header-footer-mapper.js"></script>
    <script src="js/data-mapper/pages/directions-mapper.js"></script>
    <script src="js/kakao-maps-sdk.js"></script>
    <script src="js/header-footer-loader.js"></script>
    <script src="js/common.js"></script>
    <script src="js/pages/directions.js"></script>
  </body>
</html>
